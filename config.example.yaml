agents: {}
clients: {}

## Clients
##
## Real client config lives in config.yaml, which is gitignored. The block below
## documents the split this fork is built around, because it is not obvious and it
## does not survive a fresh clone.
##
## Two Ollama clients against the SAME daemon: a local model writes the prose, and
## a large cloud model does the directing. Ollama Cloud needs no API key here - pull
## a ":cloud" model into a signed-in local daemon (`ollama pull gpt-oss:120b-cloud`)
## and it appears alongside local models on localhost:11434.
##
#clients:
#  Ollama:
#    type: ollama
#    api_url: http://localhost:11434
#    model: hf.co/TheDrummer/Rocinante-X-12B-v1-GGUF:Q4_K_M
#    max_token_length: 8192          # KV cache is ~160KB/token on a Nemo-12B;
#    enabled: true                   # 16384 costs ~1.3GB more VRAM than 8192
#
#  OllamaCloudDirector:
#    type: ollama
#    api_url: http://localhost:11434 # same daemon - it proxies cloud models
#    model: deepseek-v4-pro:cloud
#    max_token_length: 32768         # costs no local VRAM
#    enabled: true
#    # Cloud-hosted models may honour neither raw completion nor options.num_ctx,
#    # so let the API apply its own chat template instead of Talemate's.
#    api_handles_prompt_template: true
#    # REQUIRED for reasoning models. Thinking tokens are drawn from the same
#    # budget as the reply, so without a reason budget the visible response comes
#    # back EMPTY and the director silently does nothing.
#    reason_enabled: true
#    reason_tokens: 2048
#    # ALSO REQUIRED with Ollama. reason_enabled makes Talemate expect inline
#    # <think>...</think> in the response so it can strip it, but Ollama returns
#    # thinking in a SEPARATE field and the client only reads `response` - so
#    # there is nothing to strip, the pattern never matches, and the default
#    # "fail" raises ReasoningResponseError on every director turn.
#    reason_failure_behavior: ignore
#
## Route only the director at the cloud model; everything else stays local.
