#
## Note: censorship follows the MODEL, not "cloud". Talemate already tracks this
## per client via decensor_enabled, which is False for anthropic/openai/openrouter/
## deepseek-direct and swaps in a tamer system prompt. Among Ollama Cloud models
## gpt-oss:120b-cloud is heavily safety-trained; deepseek and kimi are far more
## permissive. With abstract_context on, the director never sees prose either way.
creator:
  content_context:
  - a fun and engaging slice of life story
  - a terrifying horror story
  - a thrilling action story
  - a mysterious adventure
  - an epic sci-fi adventure

